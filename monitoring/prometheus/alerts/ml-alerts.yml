# monitoring/prometheus/alerts/ml-alerts.yml
groups:
  - name: ml_performance
    interval: 30s
    rules:
      - alert: HighAPILatency
        expr: histogram_quantile(0.95, rate(api_request_latency_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High API latency detected"
          description: "95th percentile latency is {{ $value }}s (threshold: 2s)"

      - alert: LowModelQuality
        expr: generation_quality_score < 0.5
        for: 10m
        labels:
          severity: warning
          component: model
        annotations:
          summary: "Model quality score is low"
          description: "Quality score is {{ $value }} (threshold: 0.5)"

      - alert: HighErrorRate
        expr: rate(api_requests_total{status="500"}[5m]) / rate(api_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"




