# monitoring/prometheus/prometheus-local.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ad-generator-local'
    environment: 'development'

# Alertmanager configuration (optional for local)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load alert rules
rule_files:
  - "/etc/prometheus/alerts/*.yml"

scrape_configs:
  # Prometheus itself (self-monitoring)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Your FastAPI Application
  - job_name: 'ad-generator-api'
    static_configs:
      - targets: ['ad-api:8000']  # Docker service name
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Node Exporter (system metrics - CPU, RAM, Disk)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']